[package]
name = "dex"
version = "0.1.0"
edition = "2021"
description = "One pool per coin, for life: a bonding curve that becomes a constant-product pool in the same place."
license = "MIT"
publish = false

[lib]
name = "dex"
crate-type = ["cdylib", "lib"]

[features]
default = []
# Anchor's switches. `no-entrypoint` lets the tests link the crate for its types and math.
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
# Anchor's zero-copy accounts derive bytemuck's traits by name.
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
spl-token-2022-interface = "3"
spl-token-metadata-interface = "1"
spl-transfer-hook-interface = "2.1"

# Deploy rent is paid per byte, so the release build optimises for size.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
